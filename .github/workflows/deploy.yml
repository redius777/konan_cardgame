name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/conan-card-game-clone-011CUVAxrPjterKspJRwhd6v

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
          exclude: |
            src
            dist
            node_modules
            download_package
            .github
            package.json
            package-lock.json
            tsconfig.json
            server.js
            conan-tcg-game.zip
            GAME_LOGIC.md
            README.md

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名探偵コナンTCG - メニュー</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 60px;
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 50px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            padding: 25px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-decoration: none;
            display: block;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-battle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-deck {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-rules {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1>🔍 名探偵コナンTCG 🎴</h1>
        <div class="subtitle">トレーディングカードゲーム</div>

        <div class="menu-buttons">
            <a href="battle.html" class="menu-btn btn-battle">
                ⚔️ バトル開始
            </a>
            <a href="deckbuilder.html" class="menu-btn btn-deck">
                🎴 デッキビルダー
            </a>
            <a href="game.html" class="menu-btn btn-rules">
                📖 クイックプレイ（デフォルトデッキ）
            </a>
        </div>

        <div class="footer">
            <p>名探偵コナン © 青山剛昌/小学館</p>
            <p>このゲームはファンメイドです</p>
        </div>
    </div>
</body>
</html>
